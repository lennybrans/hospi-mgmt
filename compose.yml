name: hospi-mgmt

networks:
  app-network:

volumes:
  pg-data:

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - 127.0.0.1:5431:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql

  django-app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.local
    ports:
      - 127.0.0.1:8000:8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: >
      sh -c "
        python3 manage.py migrate &&
        exec gunicorn --bind 0.0.0.0:8000 --workers 3 webapp.wsgi:application
      "
