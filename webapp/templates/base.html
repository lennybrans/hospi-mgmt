<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#0d9488" />
  <title>{% block title %}Hospi management{% endblock %}</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Flowbite CSS -->
  <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css" rel="stylesheet" />

  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">
  {% if user.is_authenticated %}
  <header class="border-b-2 border-teal-600 bg-white shadow-sm">
    <div class="mx-auto max-w-6xl px-4 sm:px-6">
      {% include 'components/navbar.html' %}
    </div>
  </header>
  {% endif %}
  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6 sm:py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="border-t border-slate-200 bg-white py-4 text-center text-sm text-slate-400">
    <!-- TBC -->
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>
  {% block extra_script %}{% endblock %}
</body>
</html>
