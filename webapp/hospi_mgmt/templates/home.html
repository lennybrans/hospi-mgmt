{% extends 'base.html' %}

{% block content %}
<div class="mx-auto grid w-full max-w-5xl grid-cols-1 gap-6 sm:gap-8 md:grid-cols-2">
  <a
    id="catBtn"
    href="{% url 'gato' %}"
    class="relative h-56 overflow-hidden rounded-2xl bg-slate-200 shadow-lg transition hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-teal-300 sm:h-72"
  >
    <div class="absolute inset-0 z-10 flex items-center justify-center bg-black/30">
      <span class="text-3xl font-bold text-white">
        Gat@
      </span>
    </div>
    <div id="catMedia" class="absolute inset-0"></div>
  </a>

  <a
    id="dogBtn"
    href="{% url 'perro' %}"
    class="relative h-56 overflow-hidden rounded-2xl bg-slate-200 shadow-lg transition hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-teal-300 sm:h-72"
  >
    <div class="absolute inset-0 z-10 flex items-center justify-center bg-black/30">
      <span class="text-3xl font-bold text-white">
        Perr@
      </span>
    </div>
    <div id="dogMedia" class="absolute inset-0"></div>
  </a>
</div>
{% endblock %}

{% block extra_script %}
<script>
  function renderMedia(container, url) {
    container.innerHTML = "";

    if (url.endsWith(".mp4") || url.endsWith(".webm")) {
      const video = document.createElement("video");
      video.src = url;
      video.autoplay = true;
      video.loop = true;
      video.muted = true;
      video.className = "w-full h-full object-cover";
      container.appendChild(video);
    } else {
      const img = document.createElement("img");
      img.src = url;
      img.className = "w-full h-full object-cover";
      container.appendChild(img);
    }
  }

  async function loadCat() {
    const container = document.getElementById("catMedia");

    const useGif = Math.random() > 0.5;
    const url = useGif
      ? `https://cataas.com/cat/gif?${Date.now()}`
      : `https://cataas.com/cat?${Date.now()}`;

    renderMedia(container, url);
  }

  async function loadDog() {
    const container = document.getElementById("dogMedia");
    const res = await fetch("https://random.dog/woof.json");
    const data = await res.json();
    renderMedia(container, data.url);
  }

  // Initial media
  loadCat();
  loadDog();
</script>
{% endblock %}
